<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Luxury Champagne Gold Gradients -->
    <linearGradient id="bcGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="bcGoldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="bcLoopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="75%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <filter id="bcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- EMBLEM: RAZOR BLADE & BOWL LOOP (MONOGRAM B) -->
  <g filter="url(#bcGlow)" transform="translate(10, 10)">
    
    <!-- RIBBON LOOP (BOWL OF LOWERCASE B) -->
    <!-- Continuous aerodynamic loop wrapping out of the razor blade -->
    <path 
      d="M 98 116
         C 112 142, 134 162, 160 162
         C 194 162, 218 136, 218 102
         C 218 68, 190 46, 154 46
         C 130 46, 110 58, 96 76
         L 112 90
         C 122 78, 136 68, 152 68
         C 174 68, 192 82, 192 102
         C 192 124, 174 140, 152 140
         C 134 140, 120 128, 110 108
         Z"
      transform="scale(0.8) translate(-10, 8)"
      fill="url(#bcLoopGradient)"
      stroke="url(#bcGoldShine)"
      stroke-width="1.8"
    />

    <!-- RAZOR BLADE (DIAGONAL STEM OF B) -->
    <g transform="translate(68, 76) rotate(-42)">
      <!-- Outer Razor Frame with 4 classic corner notches & center cut -->
      <path 
        d="M -56 -24 
           L -46 -24 L -46 -28 L 46 -28 L 46 -24 L 56 -24 
           C 59 -24, 61 -22, 61 -18 
           L 61 -6 L 58 -6 L 58 6 L 61 6 L 61 18 
           C 61 22, 59 24, 56 24 
           L 46 24 L 46 28 L -46 28 L -46 24 L -56 24 
           C -59 24, -61 22, -61 18 
           L -61 6 L -58 6 L -58 -6 L -61 -6 L -61 -18 
           C -61 -22, -59 -24, -56 -24 Z" 
        fill="url(#bcGoldGradient)" 
        stroke="url(#bcGoldShine)" 
        stroke-width="2.2"
      />

      <!-- Classic Inner Razor Blade Cutout Pattern -->
      <path 
        d="M -44 0 
           C -44 -4, -40 -7, -36 -7 
           L -13 -7 
           C -10 -12, -5 -15, 0 -15 
           C 5 -15, 10 -12, 13 -7 
           L 36 -7 
           C 40 -7, 44 -4, 44 0 
           C 44 4, 40 7, 36 7 
           L 13 7 
           C 10 12, 5 15, 0 15 
           C -5 15, -10 12, -13 7 
           L -36 7 
           C -40 7, -44 4, -44 0 Z" 
        fill="#07090e" 
        stroke="url(#bcGoldShine)" 
        stroke-width="1.2"
      />

      <!-- Center hole and pivots -->
      <circle cx="0" cy="0" r="4.5" fill="#07090e" stroke="url(#bcGoldShine)" stroke-width="1" />
      <circle cx="-26" cy="0" r="2.5" fill="url(#bcGoldGradient)" />
      <circle cx="26" cy="0" r="2.5" fill="url(#bcGoldGradient)" />
    </g>

  </g>
</svg>
