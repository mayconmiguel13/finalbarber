<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="favShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background circle/rounded square for crisp contrast in browser tabs -->
  <rect width="200" height="200" rx="44" fill="#07090e" stroke="url(#favGold)" stroke-width="6" />

  <g transform="translate(15, 12)">
    <!-- Loop Ribbon -->
    <path 
      d="M 98 116
         C 112 142, 134 162, 160 162
         C 194 162, 218 136, 218 102
         C 218 68, 190 46, 154 46
         C 130 46, 110 58, 96 76
         L 112 90
         C 122 78, 136 68, 152 68
         C 174 68, 192 82, 192 102
         C 192 124, 174 140, 152 140
         C 134 140, 120 128, 110 108
         Z"
      transform="scale(0.8) translate(-10, 8)"
      fill="url(#favGold)"
      stroke="url(#favShine)"
      stroke-width="2.5"
    />

    <!-- Razor Blade -->
    <g transform="translate(68, 76) rotate(-42)">
      <path 
        d="M -56 -24 
           L -46 -24 L -46 -28 L 46 -28 L 46 -24 L 56 -24 
           C 59 -24, 61 -22, 61 -18 
           L 61 -6 L 58 -6 L 58 6 L 61 6 L 61 18 
           C 61 22, 59 24, 56 24 
           L 46 24 L 46 28 L -46 28 L -46 24 L -56 24 
           C -59 24, -61 22, -61 18 
           L -61 6 L -58 6 L -58 -6 L -61 -6 L -61 -18 
           C -61 -22, -59 -24, -56 -24 Z" 
        fill="url(#favGold)" 
        stroke="url(#favShine)" 
        stroke-width="3"
      />
      <path 
        d="M -44 0 
           C -44 -4, -40 -7, -36 -7 
           L -13 -7 
           C -10 -12, -5 -15, 0 -15 
           C 5 -15, 10 -12, 13 -7 
           L 36 -7 
           C 40 -7, 44 -4, 44 0 
           C 44 4, 40 7, 36 7 
           L 13 7 
           C 10 12, 5 15, 0 15 
           C -5 15, -10 12, -13 7 
           L -36 7 
           C -40 7, -44 4, -44 0 Z" 
        fill="#07090e" 
        stroke="url(#favShine)" 
        stroke-width="2"
      />
      <circle cx="0" cy="0" r="4.5" fill="#07090e" stroke="url(#favShine)" stroke-width="1.5" />
    </g>
  </g>
</svg>
