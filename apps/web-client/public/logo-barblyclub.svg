<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Premium Champagne Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182235" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGoldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Diamond Shield -->
  <path 
    d="M60 6 L108 28 L108 80 L60 114 L12 80 L12 28 Z" 
    fill="url(#shieldBg)" 
    stroke="url(#goldLinear)" 
    stroke-width="2.5" 
    stroke-linejoin="round"
  />

  <!-- Inner Inset Border with Gold Dash Accent -->
  <path 
    d="M60 14 L100 32 L100 76 L60 104 L20 76 L20 32 Z" 
    fill="none" 
    stroke="url(#goldLight)" 
    stroke-width="1" 
    stroke-opacity="0.35" 
    stroke-linejoin="round"
  />

  <!-- Top Crown / Club Accent (3-Point VIP Emblem) -->
  <path 
    d="M48 24 L60 18 L72 24 L68 28 L52 28 Z" 
    fill="url(#goldLinear)" 
  />
  <circle cx="60" cy="17" r="1.8" fill="#FEF08A" />

  <!-- Monogram "B" & Razor Blade Silhouette -->
  <!-- Left Spine (Razor handle / straight back) -->
  <rect 
    x="34" 
    y="32" 
    width="8" 
    height="54" 
    rx="3" 
    fill="url(#goldLight)" 
  />

  <!-- Top Loop of "B" (Shaped like a Barber Razor Blade Head) -->
  <path 
    d="M42 32 H66 C75 32 82 37 82 46 C82 54 75 58 66 58 H42 V32 Z" 
    fill="none" 
    stroke="url(#goldLinear)" 
    stroke-width="7" 
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Bottom Loop of "B" (Wider Barber Loop) -->
  <path 
    d="M42 56 H68 C78 56 86 61 86 71 C86 80 78 86 68 86 H42 V56 Z" 
    fill="none" 
    stroke="url(#goldLinear)" 
    stroke-width="7" 
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Center Razor Notch Slits (Iconic Barber Blade Cutout Detail) -->
  <rect x="52" y="42" width="12" height="4" rx="2" fill="#0F172A" />
  <rect x="54" y="69" width="14" height="4" rx="2" fill="#0F172A" />

  <!-- Cross Scissors Pivot / Sparkle Star in center intersection -->
  <path 
    d="M60 52 L62 56 L66 56 L63 58 L64 62 L60 59 L56 62 L57 58 L54 56 L58 56 Z" 
    fill="#FEF08A" 
  />
</svg>
